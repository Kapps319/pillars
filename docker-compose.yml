# `docker compose up` boots the whole stack keyless:
#   frontend :3000  ·  api :8000 (/docs)  ·  db :5432  ·  redis :6379  ·  worker
# The dashboard is populated on first boot (SEED_ON_STARTUP=true + mock source).
# Add real keys in .env to activate Reddit/Google/LLM — no code changes.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: leadfinder
      POSTGRES_PASSWORD: leadfinder
      POSTGRES_DB: leadfinder
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadfinder"]
      interval: 3s
      timeout: 3s
      retries: 15
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15
    ports:
      - "6379:6379"

  api:
    build: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://leadfinder:leadfinder@db:5432/leadfinder
      REDIS_URL: redis://redis:6379/0
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://leadfinder:leadfinder@db:5432/leadfinder
      REDIS_URL: redis://redis:6379/0
      SEED_ON_STARTUP: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # The browser calls the API directly, so this must be reachable from
        # the host machine (not the docker network).
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
